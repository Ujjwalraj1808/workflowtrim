name: Refresh institution research output from OpenAlex

on:
  schedule:
    - cron: "23 4 * * 4" # Thursdays 04:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # OpenAlex meters requests (1,000 free credits a day; about 7 per institution), so each run refreshes the
      # institutions without a snapshot first and then the oldest ones. OPENALEX_API_KEY is optional: set the
      # secret to draw on a paid budget and cover the whole corpus in one run.
      - run: npm run fetch:research
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      # The merge below is unattended, so the tree the pull request carries must pass what a person's branch passes.
      # The gates never fail the job: when one does the pull request is still opened, the merge step is skipped and
      # the next step labels it for review, so a red snapshot waits for a person instead of landing on main.
      - id: gates
        uses: ./.github/actions/gates
      - uses: peter-evans/create-pull-request@v7
        id: cpr
        with:
          branch: bot/refresh-research
          title: "Weekly refresh: institution research output from OpenAlex"
          commit-message: "chore: refresh institution research output from OpenAlex"
          body: |
            Automated weekly pull of oncology works per institution from the OpenAlex works API (CC0): works and citations for the last five publication years, counts per year, open-access, clinical-trial and review counts, the 15 most-cited works and the 10 authors with the most works.
            Each run covers what the free daily budget allows (about 140 institutions), newest gaps first, then the oldest snapshots; `unresolved` in the index lists institutions with no confident match.
            Files under `public/openalex/research/` and `public/openalex/research-index.json` changed. Institution pages show the Research output panel from these files; /universities/ reads the five-year columns from the index.
          labels: automated, pipeline
          delete-branch: true
      - name: Merge it (only when this run's gates passed)
        if: steps.cpr.outputs.pull-request-number != '' && steps.gates.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --squash --delete-branch "${{ steps.cpr.outputs.pull-request-number }}" || echo "merge deferred, the pull request stays open for a human"
      - name: Leave it for review (a gate failed in this run)
        if: steps.cpr.outputs.pull-request-number != '' && steps.gates.outputs.passed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create needs-review --color D93F0B --description "A person must check this before it lands" --force || true
          gh pr edit "${{ steps.cpr.outputs.pull-request-number }}" --add-label needs-review
          gh pr comment "${{ steps.cpr.outputs.pull-request-number }}" --body "Not merged: ${{ steps.gates.outputs.failed }} failed in [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). The snapshot is on this branch for a person to read."
