name: Runtime

on:
  workflow_dispatch:
    inputs:
      renderer_only:
        description: Build a renderer engineering artifact instead of the complete runtime
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build WINQ-EMU from source
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate source lock
        shell: pwsh
        run: python runtime-build/validate-lock.py

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            bison
            diffutils
            flex
            git
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-dtc
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-libepoxy
            mingw-w64-ucrt-x86_64-libslirp
            mingw-w64-ucrt-x86_64-libusb
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pixman
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-yaml
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-zstd

      - name: Build runtime and corresponding source
        if: ${{ !inputs.renderer_only }}
        id: build_runtime
        shell: msys2 {0}
        run: runtime-build/build.sh runtime-output

      - name: Build renderer engineering candidate
        if: ${{ inputs.renderer_only }}
        id: build_renderer
        shell: msys2 {0}
        run: bash runtime-build/build-renderer.sh renderer-output

      - name: Smoke test QEMU
        if: ${{ !inputs.renderer_only }}
        shell: msys2 {0}
        run: |
          runtime-output/smoke/qemu-system-x86_64.exe --version
          runtime-output/smoke/qemu-system-x86_64.exe -accel help | tr -d '\r' | tee runtime-output/smoke/accelerators.txt
          grep -Fx whpx runtime-output/smoke/accelerators.txt
          runtime-output/smoke/qemu-system-x86_64.exe -device help 2>&1 | tee runtime-output/smoke/devices.txt
          grep -F 'name "usb-host"' runtime-output/smoke/devices.txt
          grep -F 'name "qemu-xhci"' runtime-output/smoke/devices.txt
          runtime-output/smoke/qemu-system-x86_64.exe -device usb-host,help 2>&1 | tee runtime-output/smoke/usb-properties.txt
          grep -F 'auto-reconnect' runtime-output/smoke/usb-properties.txt
          python runtime-build/smoke-usb.py runtime-output/smoke/qemu-system-x86_64.exe
          python runtime-build/smoke-memory.py runtime-output/smoke/qemu-system-x86_64.exe
          python runtime-build/smoke-unicode-paths.py runtime-output/smoke
          python runtime-build/test-win32-handles-native.py runtime-output/smoke/libvirglrenderer-1.dll

      - name: Verify archives
        if: ${{ !inputs.renderer_only }}
        shell: pwsh
        run: python runtime-build/verify.py runtime-output

      - name: Remove smoke-test copy
        if: ${{ !inputs.renderer_only }}
        shell: pwsh
        run: Remove-Item -Recurse -Force runtime-output/smoke

      - name: Upload test artifacts
        if: ${{ !cancelled() && !inputs.renderer_only && steps.build_runtime.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: winq-emu-alpha10-source-build
          path: |
            runtime-output/*.zip
            runtime-output/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Upload renderer engineering artifacts
        if: ${{ !cancelled() && inputs.renderer_only && steps.build_renderer.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: venus-renderer-candidate
          path: |
            renderer-output/*.zip
            renderer-output/SHA256SUMS
            renderer-output/COPYING
          if-no-files-found: error
          retention-days: 14
