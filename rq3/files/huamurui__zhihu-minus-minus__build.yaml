name: Build Android + iOS and Release

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Build artifacts only, or create a GitHub Release
        required: true
        default: build
        type: choice
        options:
          - build
          - release
      publish_release:
        description: Publish immediately instead of creating a draft release (release mode only)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22.x
  EAS_CLI_VERSION: 23.0.0
  EAS_PROFILE: preview

jobs:
  quality:
    name: Verify source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Validate release metadata
        if: ${{ inputs.build_mode == 'release' }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Releases must be created from the main branch"
            exit 1
          fi

          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          if [ "$PACKAGE_VERSION" != "$APP_VERSION" ]; then
            echo "package.json ($PACKAGE_VERSION) and app.json ($APP_VERSION) versions differ"
            exit 1
          fi

          if git rev-parse "refs/tags/v${PACKAGE_VERSION}" >/dev/null 2>&1; then
            echo "Tag v${PACKAGE_VERSION} already exists. Bump package.json and app.json before releasing."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run all checks
        run: npm run check

  build-android:
    name: Build Android APKs
    needs: quality
    runs-on: ubuntu-latest
    env:
      EAS_LOCAL_BUILD_SKIP_CLEANUP: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: ${{ env.EAS_CLI_VERSION }}
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Android artifact
        id: android-artifact
        run: |
          echo "archive=${RUNNER_TEMP}/android-apks.tar.gz" >> "$GITHUB_OUTPUT"
          echo "directory=${RUNNER_TEMP}/android-apks" >> "$GITHUB_OUTPUT"

      - name: Prepare telemetry config
        env:
          FIREBASE_ANDROID_JSON_B64: ${{ secrets.FIREBASE_ANDROID_JSON_B64 }}
          FIREBASE_IOS_PLIST_B64: ${{ secrets.FIREBASE_IOS_PLIST_B64 }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          : "${FIREBASE_ANDROID_JSON_B64:?Missing GitHub Secret FIREBASE_ANDROID_JSON_B64}"
          : "${FIREBASE_IOS_PLIST_B64:?Missing GitHub Secret FIREBASE_IOS_PLIST_B64}"
          : "${EXPO_PUBLIC_SENTRY_DSN:?Missing GitHub Secret EXPO_PUBLIC_SENTRY_DSN}"
          : "${SENTRY_AUTH_TOKEN:?Missing GitHub Secret SENTRY_AUTH_TOKEN}"

          decode_base64_secret() {
            local secret_name="$1"
            local encoded="$2"
            local output_path="$3"
            encoded="$(printf '%s' "$encoded" | tr -d '[:space:]')"
            local -a decoder
            if [[ "${RUNNER_OS:-Linux}" == "macOS" ]]; then
              decoder=(base64 -D)
            else
              decoder=(base64 --decode)
            fi
            if ! printf '%s' "$encoded" | "${decoder[@]}" > "$output_path"; then
              echo "Invalid base64 in GitHub Secret ${secret_name}. Store one-line base64 only, without backticks."
              exit 1
            fi
          }

          decode_base64_secret FIREBASE_ANDROID_JSON_B64 "$FIREBASE_ANDROID_JSON_B64" google-services.json
          decode_base64_secret FIREBASE_IOS_PLIST_B64 "$FIREBASE_IOS_PLIST_B64" GoogleService-Info.plist

          {
            echo "EXPO_PUBLIC_FIREBASE_ANALYTICS_ENABLED=true"
            echo "EXPO_PUBLIC_SENTRY_DSN=$EXPO_PUBLIC_SENTRY_DSN"
            echo "SENTRY_AUTH_TOKEN=$SENTRY_AUTH_TOKEN"
            echo "GOOGLE_SERVICES_JSON=./google-services.json"
            echo "GOOGLE_SERVICE_INFO_PLIST=./GoogleService-Info.plist"
          } >> "$GITHUB_ENV"

      - name: Build APKs
        run: eas build --platform android --profile "$EAS_PROFILE" --local --non-interactive --output="${{ steps.android-artifact.outputs.archive }}"

      - name: Extract, verify and name APKs
        env:
          ANDROID_ARCHIVE: ${{ steps.android-artifact.outputs.archive }}
          ANDROID_OUTPUT_DIR: ${{ steps.android-artifact.outputs.directory }}
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          EXTRACT_DIR="${RUNNER_TEMP}/android-apks-raw"
          mkdir -p "$EXTRACT_DIR" "$ANDROID_OUTPUT_DIR"
          tar -xzf "$ANDROID_ARCHIVE" -C "$EXTRACT_DIR"

          mapfile -t RAW_APKS < <(find "$EXTRACT_DIR" -type f -name "*.apk" | sort)
          if [ "${#RAW_APKS[@]}" -ne 4 ]; then
            echo "Expected four split APKs, found ${#RAW_APKS[@]}"
            exit 1
          fi

          for APK_PATH in "${RAW_APKS[@]}"; do
            mapfile -t PACKAGED_ABIS < <(
              unzip -Z1 "$APK_PATH" |
                sed -n 's#^lib/\([^/]*\)/.*#\1#p' |
                sort -u
            )
            if [ "${#PACKAGED_ABIS[@]}" -ne 1 ]; then
              echo "Expected one ABI in $APK_PATH, found: ${PACKAGED_ABIS[*]:-none}"
              exit 1
            fi

            ABI="${PACKAGED_ABIS[0]}"
            case "$ABI" in
              arm64-v8a) ASSET_ARCH="arm64-v8a" ;;
              armeabi-v7a|x86|x86_64) ASSET_ARCH="compat-${ABI}" ;;
              *)
                echo "Unexpected ABI in $APK_PATH: $ABI"
                exit 1
                ;;
            esac

            cp "$APK_PATH" "$ANDROID_OUTPUT_DIR/zhihu-minus-minus-v${APP_VERSION}-${ASSET_ARCH}.apk"
          done

          mapfile -t NAMED_APKS < <(find "$ANDROID_OUTPUT_DIR" -maxdepth 1 -type f -name "*.apk" | sort)
          if [ "${#NAMED_APKS[@]}" -ne 4 ]; then
            echo "Expected four uniquely named APKs, found ${#NAMED_APKS[@]}"
            exit 1
          fi

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: ${{ steps.android-artifact.outputs.directory }}/*.apk
          if-no-files-found: error
          retention-days: 7

  build-ios:
    name: Build unsigned iOS IPA
    needs: quality
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare telemetry config
        env:
          FIREBASE_ANDROID_JSON_B64: ${{ secrets.FIREBASE_ANDROID_JSON_B64 }}
          FIREBASE_IOS_PLIST_B64: ${{ secrets.FIREBASE_IOS_PLIST_B64 }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          : "${FIREBASE_ANDROID_JSON_B64:?Missing GitHub Secret FIREBASE_ANDROID_JSON_B64}"
          : "${FIREBASE_IOS_PLIST_B64:?Missing GitHub Secret FIREBASE_IOS_PLIST_B64}"
          : "${EXPO_PUBLIC_SENTRY_DSN:?Missing GitHub Secret EXPO_PUBLIC_SENTRY_DSN}"
          : "${SENTRY_AUTH_TOKEN:?Missing GitHub Secret SENTRY_AUTH_TOKEN}"

          decode_base64_secret() {
            local secret_name="$1"
            local encoded="$2"
            local output_path="$3"
            encoded="$(printf '%s' "$encoded" | tr -d '[:space:]')"
            local -a decoder
            if [[ "${RUNNER_OS:-Linux}" == "macOS" ]]; then
              decoder=(base64 -D)
            else
              decoder=(base64 --decode)
            fi
            if ! printf '%s' "$encoded" | "${decoder[@]}" > "$output_path"; then
              echo "Invalid base64 in GitHub Secret ${secret_name}. Store one-line base64 only, without backticks."
              exit 1
            fi
          }

          decode_base64_secret FIREBASE_ANDROID_JSON_B64 "$FIREBASE_ANDROID_JSON_B64" google-services.json
          decode_base64_secret FIREBASE_IOS_PLIST_B64 "$FIREBASE_IOS_PLIST_B64" GoogleService-Info.plist

          {
            echo "EXPO_PUBLIC_FIREBASE_ANALYTICS_ENABLED=true"
            echo "EXPO_PUBLIC_SENTRY_DSN=$EXPO_PUBLIC_SENTRY_DSN"
            echo "SENTRY_AUTH_TOKEN=$SENTRY_AUTH_TOKEN"
            echo "GOOGLE_SERVICES_JSON=./google-services.json"
            echo "GOOGLE_SERVICE_INFO_PLIST=./GoogleService-Info.plist"
          } >> "$GITHUB_ENV"

      - name: Expo prebuild iOS
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Build unsigned iOS app
        run: |
          cd ios
          echo "export NODE_BINARY=$(which node)" > .xcode.env.local

          WORKSPACE_PATH=$(find . -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          WORKSPACE=$(basename "$WORKSPACE_PATH")
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Found workspace: $WORKSPACE, scheme: $SCHEME"

          set +e
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$GITHUB_WORKSPACE/build" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            clean build > xcodebuild.log 2>&1

          EXIT_CODE=$?
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "xcodebuild failed with exit code $EXIT_CODE"
            grep -i -E "error:|failed:|fatal:" xcodebuild.log | head -n 50
            tail -n 100 xcodebuild.log
            exit "$EXIT_CODE"
          fi

      - name: Package unsigned IPA
        id: ios-artifact
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          IPA_NAME="zhihu-minus-minus-v${APP_VERSION}-unsigned.ipa"
          ARTIFACT_DIR="${RUNNER_TEMP}/ipa-build"
          APP_PATH=$(find build -name "*.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "No compiled .app was found"
            exit 1
          fi

          mkdir -p "${ARTIFACT_DIR}/Payload"
          cp -R "$APP_PATH" "${ARTIFACT_DIR}/Payload/"
          cd "$ARTIFACT_DIR"
          zip -r "$IPA_NAME" Payload
          echo "path=${ARTIFACT_DIR}/${IPA_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: ${{ steps.ios-artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    if: ${{ inputs.build_mode == 'release' }}
    needs:
      - build-android
      - build-ios
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download Android and iOS artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Prepare release assets
        id: release
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          RELEASE_TAG="v${APP_VERSION}"
          PRIMARY_APK="dist/zhihu-minus-minus-v${APP_VERSION}-arm64-v8a.apk"
          mapfile -t APKS < <(find dist -maxdepth 1 -type f -name "*.apk" | sort)
          mapfile -t IPAS < <(find dist -maxdepth 1 -type f -name "*.ipa" | sort)

          if [ ! -f "$PRIMARY_APK" ]; then
            echo "Primary arm64-v8a APK was not found at $PRIMARY_APK"
            exit 1
          fi

          if [ "${#APKS[@]}" -ne 4 ] || [ "${#IPAS[@]}" -ne 1 ]; then
            echo "Expected four APKs and one IPA, found ${#APKS[@]} APKs and ${#IPAS[@]} IPAs"
            exit 1
          fi

          python3 scripts/generate-altstore-source.py \
            --ipa "${IPAS[0]}" \
            --output dist/altstore-source.json \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --date "$(date -u +%F)"

          (
            cd dist
            sha256sum ./*.apk ./*.ipa ./altstore-source.json > SHA256SUMS.txt
          )

          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "primary_apk=${PRIMARY_APK}" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          PRIMARY_APK: ${{ steps.release.outputs.primary_apk }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if git rev-parse "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists. Bump package.json and app.json before creating another release."
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Bump package.json and app.json before creating another release."
            exit 1
          fi

          RELEASE_FLAGS=(
            --title "$RELEASE_TAG"
            --target "$GITHUB_SHA"
            --generate-notes
            --fail-on-no-commits
            --notes "Android 默认提供已验证的 arm64-v8a APK；其余 compat APK 未经实机验证，供对应架构设备手动安装。iOS 为未签名 IPA，SideStore / AltStore Classic 订阅源：https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/altstore-source.json 。SHA256SUMS.txt 可用于校验下载文件。"
            --draft
          )

          # Older clients install the first APK returned by the GitHub API.
          # Create the draft with arm64-v8a first, then upload compatibility
          # builds, so the legacy one-click updater keeps its verified target.
          gh release create "$RELEASE_TAG" "$PRIMARY_APK" "${RELEASE_FLAGS[@]}"

          mapfile -t REMAINING_FILES < <(
            find dist -maxdepth 1 -type f \
              \( -name "*.apk" -o -name "*.ipa" -o -name "altstore-source.json" -o -name "SHA256SUMS.txt" \) \
              ! -path "$PRIMARY_APK" |
              sort
          )
          gh release upload "$RELEASE_TAG" "${REMAINING_FILES[@]}"

          # The stable source URL changes only when the complete release is public.
          if [ "$PUBLISH_RELEASE" = "true" ]; then
            gh release edit "$RELEASE_TAG" --draft=false
          fi
