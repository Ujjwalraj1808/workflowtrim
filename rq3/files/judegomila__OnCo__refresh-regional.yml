name: Refresh regional approvals check (EMA register)

on:
  schedule:
    - cron: "37 6 * * 3" # Wednesdays 06:37 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/fetch-ema.ts
      # The merge below is unattended, so the tree the pull request carries must pass what a person's branch passes.
      # The gates never fail the job: when one does the pull request is still opened, the merge step is skipped and
      # the next step labels it for review, so a red snapshot waits for a person instead of landing on main.
      - id: gates
        uses: ./.github/actions/gates
      - uses: peter-evans/create-pull-request@v7
        id: cpr
        with:
          branch: bot/refresh-regional
          title: "Weekly refresh: EMA register check for regional approvals"
          commit-message: "chore: check regional approvals against the EMA register"
          body: |
            Automated weekly comparison of `src/data/regional-approvals.ts` with the EMA human-medicines register (public spreadsheet, no key).
            Outputs: `public/regional/candidates.json` (missing EU rows, status or year disagreements, oncology medicines not in the corpus) and `public/regional/verified.json` (EU rows that agree, with the check date). When every checked row agrees the `EPAR_CHECKED` stamp in `regional-approvals.ts` moves to today.
            MHRA and PMDA have no machine-readable lists; UK and Japanese rows stay hand-verified.
          labels: automated, pipeline
          delete-branch: true
      - name: Merge it (only when this run's gates passed)
        if: steps.cpr.outputs.pull-request-number != '' && steps.gates.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --squash --delete-branch "${{ steps.cpr.outputs.pull-request-number }}" || echo "merge deferred, the pull request stays open for a human"
      - name: Leave it for review (a gate failed in this run)
        if: steps.cpr.outputs.pull-request-number != '' && steps.gates.outputs.passed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create needs-review --color D93F0B --description "A person must check this before it lands" --force || true
          gh pr edit "${{ steps.cpr.outputs.pull-request-number }}" --add-label needs-review
          gh pr comment "${{ steps.cpr.outputs.pull-request-number }}" --body "Not merged: ${{ steps.gates.outputs.failed }} failed in [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). The snapshot is on this branch for a person to read."
