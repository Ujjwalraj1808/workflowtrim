name: Refresh HTA decisions and survival statistics

on:
  schedule:
    - cron: "47 5 1 * *" # 1st of each month 05:47 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/fetch-hta.ts
      - run: npx tsx scripts/fetch-survival.ts
      # The merge below is unattended, so the tree the pull request carries must pass what a person's branch passes.
      # The gates never fail the job: when one does the pull request is still opened, the merge step is skipped and
      # the next step labels it for review, so a red snapshot waits for a person instead of landing on main.
      - id: gates
        uses: ./.github/actions/gates
      - uses: peter-evans/create-pull-request@v7
        id: cpr
        with:
          branch: bot/refresh-hta
          title: "Monthly refresh: HTA decisions (NICE, G-BA, PBAC) and SEER survival"
          commit-message: "chore: refresh HTA decisions and survival snapshots"
          body: |
            Automated monthly pull of:
            - `public/hta/index.json`: every NICE technology appraisal cited in `coverage-uk.ts` re-read for title, dates and withdrawal; the latest G-BA benefit-assessment procedures matched to corpus products; the latest PBAC meeting outcome documents (`/hta/`).
            - `public/survival/index.json`: five-year relative survival overall and by stage from the SEER Cancer Stat Facts pages for every mapped cancer (`/survival/`).
            Rows flagged "TA page does not name this product" mean a TA number in `coverage-uk.ts` needs checking.
          labels: automated, pipeline
          delete-branch: true
      - name: Merge it (only when this run's gates passed)
        if: steps.cpr.outputs.pull-request-number != '' && steps.gates.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --squash --delete-branch "${{ steps.cpr.outputs.pull-request-number }}" || echo "merge deferred, the pull request stays open for a human"
      - name: Leave it for review (a gate failed in this run)
        if: steps.cpr.outputs.pull-request-number != '' && steps.gates.outputs.passed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create needs-review --color D93F0B --description "A person must check this before it lands" --force || true
          gh pr edit "${{ steps.cpr.outputs.pull-request-number }}" --add-label needs-review
          gh pr comment "${{ steps.cpr.outputs.pull-request-number }}" --body "Not merged: ${{ steps.gates.outputs.failed }} failed in [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). The snapshot is on this branch for a person to read."
