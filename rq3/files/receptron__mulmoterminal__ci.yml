name: CI

on:
  push:
    branches: [main, dev_tool, feat/multi-agent]
  pull_request:
    branches: [main, dev_tool, feat/multi-agent]

# Every job here only reads: checkout, install, lint, typecheck, build, test, and a
# pack-install-boot smoke. Nothing writes to the repository or the API, so the default token
# needs nothing else — and every other workflow here already declares this (CodeQL flags the
# ones that do not).
permissions:
  contents: read

# A pull request supersedes its own earlier pushes, so cancelling them frees the runners the
# newest push is waiting for — four pushes to one branch used to run four full CIs to
# completion, and the macOS leg of the last one queued behind them. A push to a release branch
# is NOT cancelled: nothing would then hold a result for that commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The suite is split this many ways across parallel jobs — `yarn test` is ~80% of what a leg
# costs, and vitest reports only 14% of it as the tests themselves, the rest being per-file
# environment, import and setup that no amount of tuning removes. Keep this in step with the
# `shard:` matrix below, which has to list its values literally.
env:
  TEST_SHARD_COUNT: "3"

jobs:
  # Platform-independent by construction: eslint, vue-tsc and vite answer the same on every
  # runner, so these run once rather than once per OS. That is the same reasoning windows-pr.yaml
  # already applies when it runs `yarn test` and nothing else.
  #
  # Separate from the test jobs so a lint error surfaces in about a minute instead of behind a
  # full test run, and so neither waits for the other.
  checks:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # fetch-depth: 0 so the scope step can diff against the base commit.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      # Docs, plans and markdown are invisible to all three commands below — eslint.config.js
      # processes no markdown, and neither tsc nor vite reads docs/. The filter lives HERE rather
      # than in `on:` because a workflow that `paths-ignore` skipped produces NO CHECK AT ALL, so
      # the moment this becomes a required gate every documentation-only pull request would sit
      # on "Expected — waiting for status" and could never merge. A job that always runs and
      # decides for itself always reports. Same reasoning, same mechanism, as windows-pr.yaml.
      - uses: ./.github/actions/changed-scope
        id: scope

      - uses: actions/setup-node@v6
        if: steps.scope.outputs.code == 'true'
        id: setup-node
        with:
          node-version: 22

      # node_modules directly, rather than `cache: yarn` on setup-node above. The yarn cache is
      # 1.6 GB here and restoring it only shortens an install that still has to run: on macOS that
      # was 43s of restore plus 41s of install for a tree that is 1.2 GB when already built.
      # Caching the built tree pays the transfer once. Same shape as windows-daily.yaml.
      #
      # The lockfile hash is the key, with a prefix restore so a changed lockfile starts from the
      # previous tree and yarn reconciles the difference instead of resolving everything. The
      # resolved node version is in the key for the native builds (node-pty ships per-ABI
      # prebuilds), and `yarn install` still runs — warm, it is "Already up-to-date" plus the
      # postinstall, which is where server/fix-pty-perms.js fixes the prebuilt spawn-helper.
      - uses: actions/cache@v5
        if: steps.scope.outputs.code == 'true'
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            node-modules-${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-

      - if: steps.scope.outputs.code == 'true'
        run: yarn install --frozen-lockfile

      # A per-run key with a prefix restore, so each run picks up the newest previous cache and
      # saves its own. Deliberately NOT keyed on file contents: reuse across commits that changed
      # source is the whole saving, and eslint already decides per file what is still valid —
      # including dropping the lot when eslint.config.js changes.
      #
      # The RESOLVED node version is in the key because eslint hashes `process.version` into every
      # cache entry, so one patch bump invalidates the lot. `node-version: 22` above resolves to
      # whatever the runner ships, and ubuntu flip-flopping 22.23.1 <-> 22.23.2 is what put the
      # lint step back to 110s twice. Per-version keys let each one keep its own cache across the
      # flip; no `-${{ runner.os }}-` fallback, since a cache from another version restores fine
      # and then yields zero usable entries.
      #
      # The LOCKFILE hash is in the key for correctness, not speed. What eslint hashes into an
      # entry is its own version, the node version and the config — NOT the dependency tree. The
      # type-aware rules read their types out of node_modules, so a cached result computed against
      # the old tree is served again for a file that did not change, which is exactly the shape of
      # a dependency bump: only yarn.lock moves, and every finding the new types would produce is
      # skipped. Demonstrated locally in the other direction — a lint run made before `yarn install`
      # cached 300 "error typed" findings and kept reporting them after the install fixed the tree.
      - uses: actions/cache@v5
        if: steps.scope.outputs.code == 'true'
        with:
          path: .eslintcache
          key: eslint-cache-${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('yarn.lock') }}-${{ github.run_id }}
          restore-keys: |
            eslint-cache-${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('yarn.lock') }}-

      # lint:ci, not lint: `content` is what survives checkout rewriting every mtime, and it is
      # also why CI does not run workers — see plans/perf-lint-ci-local-split.md.
      - name: Lint
        if: steps.scope.outputs.code == 'true'
        run: yarn lint:ci

      # Covers app, server and the specs: root tsconfig.json references all five
      # projects. Specs need their own step's worth of attention because vitest
      # strips types rather than checking them.
      - name: Typecheck
        if: steps.scope.outputs.code == 'true'
        run: yarn typecheck

      - name: Build
        if: steps.scope.outputs.code == 'true'
        run: yarn build

  # ubuntu + macOS on every PR. The macOS leg is not redundancy: node-pty ships prebuilt
  # binaries per platform, tmux behaves differently, and the app's own platform branches
  # (path handling, the CLI doctor) only run for real on the runner they target.
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Keep in step with TEST_SHARD_COUNT above; a matrix cannot be computed from it.
        # Not more than three: public repositories get five concurrent macOS runners, and two
        # pull requests at once must not have to queue for each other.
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/changed-scope
        id: scope

      # The test suite is the one thing here that DOES read docs: keymap-samples.spec.ts walks
      # every markdown file under docs/guide and server/skills and runs the samples it finds
      # through the real validator, and claude-requirement-claims.spec.ts reads README.md and both
      # getting-started pages. A documentation-only pull request is exactly when those matter, so
      # ubuntu runs the suite whatever changed. macOS is gated instead: with no code changed there
      # is no platform difference left for a second runner to find.
      - name: Decide whether this leg runs
        id: gate
        shell: bash
        env:
          IS_FIRST_PLATFORM: ${{ matrix.os == 'ubuntu-latest' }}
          CODE_CHANGED: ${{ steps.scope.outputs.code }}
        run: |
          set -uo pipefail
          if [ "$IS_FIRST_PLATFORM" = "true" ] || [ "$CODE_CHANGED" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Only docs, plans and markdown changed — ubuntu already covers them."
          fi

      - uses: actions/setup-node@v6
        if: steps.gate.outputs.run == 'true'
        id: setup-node
        with:
          node-version: 22

      # The key the checks job above writes and reads; see the comment there for why the tree is
      # cached rather than the yarn download folder.
      #
      # Only the first shard carries the save half. Three shards missing the same key would each
      # upload the same ~1.2 GB tree and two of the three would be rejected as duplicates; the
      # others restore whatever a previous run left, and yarn reconciles the difference.
      - uses: actions/cache@v5
        if: steps.gate.outputs.run == 'true' && matrix.shard == 1
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            node-modules-${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-

      - uses: actions/cache/restore@v5
        if: steps.gate.outputs.run == 'true' && matrix.shard != 1
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            node-modules-${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-

      - if: steps.gate.outputs.run == 'true'
        run: yarn install --frozen-lockfile

      # vitest partitions the file list, so the shards together run exactly the files one
      # unsharded run would — verified by comparing the three JSON reports against an unsharded
      # one. Files are already isolated from each other (the suite runs them across workers), so
      # nothing carries between shards that did not already have to survive that.
      - name: Test
        if: steps.gate.outputs.run == 'true'
        run: yarn test --shard=${{ matrix.shard }}/${{ env.TEST_SHARD_COUNT }}

  # Verifies the published package actually works: pack the exact tarball
  # (prepack builds dist/), install it into a clean dir, and boot the launcher
  # until it serves "/". Mirrors mulmoclaude's publish smoke.
  package-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      # Nothing in the tarball comes from docs/ or plans/, and `files` in package.json does not
      # ship markdown beyond the README the registry renders.
      - uses: ./.github/actions/changed-scope
        id: scope

      - uses: actions/setup-node@v6
        if: steps.scope.outputs.code == 'true'
        with:
          node-version: 22
          cache: yarn

      - if: steps.scope.outputs.code == 'true'
        run: yarn install --frozen-lockfile

      # The launcher's pre-flight requires `claude --version` to succeed, and the
      # PTY check spawns `claude` — so the stub answers --version AND, for any
      # other invocation, prints a line and exits cleanly (a real PTY lifecycle)
      # without needing the real CLI + auth.
      - name: Stub Claude Code CLI
        if: steps.scope.outputs.code == 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/usr/bin/env bash\nif [ "$1" = "--version" ]; then echo "claude 0.0.0 (smoke-stub)"; exit 0; fi\necho "smoke-stub claude started"\nexit 0\n' > "$HOME/.local/bin/claude"
          chmod +x "$HOME/.local/bin/claude"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # `npm pack` runs prepack (yarn build) to produce dist/, then we install
      # the exact tarball into a clean (hoisted) dir, boot the launcher, and
      # exercise the /ws PTY path — the failure mode (#33) where node-pty's
      # spawn-helper shipped non-executable on hoisted installs.
      - name: Pack, install, boot, and exercise the /ws PTY path
        if: steps.scope.outputs.code == 'true'
        run: |
          set -euo pipefail
          TGZ="$(npm pack | tail -1)"
          echo "packed: $TGZ"
          mkdir -p /tmp/mt-smoke && cd /tmp/mt-smoke
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$TGZ"

          # Regression guard for #33: the node-pty spawn-helper must be executable
          # after the postinstall, even though node-pty is hoisted here.
          HELPER="node_modules/node-pty/prebuilds/linux-x64/spawn-helper"
          if [ -f "$HELPER" ] && [ ! -x "$HELPER" ]; then
            echo "regression: $HELPER is not executable (644) after install"; exit 1
          fi

          node_modules/.bin/mulmoterminal --no-open --port 3457 &
          LAUNCHER_PID=$!
          trap 'kill "$LAUNCHER_PID" 2>/dev/null || true' EXIT
          ok=
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3457/ >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          [ -n "$ok" ] || { echo "launcher did not serve / within 30s"; exit 1; }
          echo "tarball booted and served /"

          # A /ws connection must spawn a PTY (session + output/exit), not an
          # error frame — and the server must survive it. ws resolves from the
          # repo's own node_modules (installed by the job's `yarn install`).
          MT_PORT=3457 node "$GITHUB_WORKSPACE/scripts/ci-ws-smoke.mjs"
          curl -fsS -o /dev/null http://127.0.0.1:3457/ || { echo "server died after the PTY session"; exit 1; }
          echo "/ws spawned a PTY and the server is still serving"
