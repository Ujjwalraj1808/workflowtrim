# The WIDE Windows gate: lint, typecheck, build and test, across Node 22 and 24. It stays out
# of pull_request because that breadth is what makes it slow (NTFS tar extraction, Defender, a
# second tsc pass), and lint/typecheck/build answer the same on every platform — ci.yml already
# runs them on ubuntu and macOS.
#
# The pre-merge half is windows-pr.yaml. It is TRIGGERED on every pull request — so it always
# reports, which is what lets it be a required check — but it only executes `yarn test`, on one
# Node version, and only when the PR touches something other than docs, plans and markdown. That
# split is deliberate: tests are the only part that behaves differently on Windows, so they are
# the only part worth paying for per PR (#1721).
#
# This file is also the only one of the two that may disable Defender (below). It runs on `main`,
# a schedule and manual dispatch, so the code it executes is trusted; the PR gate executes code the
# pull request supplied and therefore keeps the runner's protection on.
#
# What it actually guards: server/infra/process/pty-env.ts branches on PATH casing ("Path"),
# the ";" delimiter and "\" separators; server/infra/process/resolve-bin.ts resolves a bare
# command name to an .exe on PATH before node-pty sees it (#794), and its spec spawns a
# real PTY here; server/index.ts spawns powershell.exe; and the postinstall
# (server/fix-pty-perms.js) runs on every install. None of that had ever executed on
# Windows before this workflow.
name: Windows (daily)

on:
  schedule:
    - cron: "0 18 * * *" # 18:00 UTC = 03:00 JST
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "plans/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-daily-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_test_windows:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Deliberately no `cache: yarn`: restoring the yarn cache tar onto NTFS is slower
      # than a fresh install. node_modules is cached directly instead (below).
      - uses: actions/setup-node@v6
        id: setup-node
        with:
          node-version: ${{ matrix.node-version }}

      # Realtime scanning makes yarn's atomic renames fail with EPERM mid-install.
      - name: Disable Defender realtime monitoring
        shell: powershell
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: actions/cache@v5
        with:
          path: node_modules
          key: win-node-modules-${{ matrix.node-version }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            win-node-modules-${{ matrix.node-version }}-

      # Restored BEFORE install so puppeteer's postinstall skips its ~120 MB download.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      # Also exercises the postinstall (server/fix-pty-perms.js) on Windows.
      - run: yarn install --frozen-lockfile --network-timeout 120000

      # The resolved node version is part of the key, not decoration: eslint hashes
      # `process.version` into every cache entry, so the 22.x and 24.x legs would otherwise share
      # one key and invalidate each other's cache on every run. The lockfile hash is there because
      # eslint does NOT hash the dependency tree, so a cached type-aware result outlives the types
      # it was computed from. Both reasons are spelled out in ci.yml.
      - uses: actions/cache@v5
        with:
          path: .eslintcache
          key: eslint-cache-${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('yarn.lock') }}-${{ github.run_id }}
          restore-keys: |
            eslint-cache-${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('yarn.lock') }}-

      - name: Lint
        run: yarn lint:ci

      - name: Typecheck
        run: yarn typecheck

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test
