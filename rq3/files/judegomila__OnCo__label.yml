name: Label PR and list affected pages

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Label by files touched
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

  affected-pages:
    name: Comment the affected page URLs
    runs-on: ubuntu-latest
    # pull_request_target runs with base-branch permissions, so only base-branch code is executed:
    # the PR's data files are read through `git show`, never imported.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Fetch the pull request head
        run: git fetch --no-tags origin "+refs/pull/${{ github.event.pull_request.number }}/head:refs/pr-head"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: List affected pages
        id: pages
        run: |
          npx tsx scripts/affected-pages.ts "${{ github.event.pull_request.base.sha }}" refs/pr-head > affected.md || true
          cat affected.md
      - name: Post or update the comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('affected.md') ? fs.readFileSync('affected.md', 'utf8').trim() : '';
            if (!body) return;
            const marker = '<!-- onco-affected-pages -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find((c) => c.body && c.body.includes(marker));
            const text = `${marker}\n${body}`;
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body: text });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body: text });
