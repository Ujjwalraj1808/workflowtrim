name: Nightly Desktop

on:
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild unchanged verified source for release recovery or upgrade QA'
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

# Never interrupt an active signer/publisher. Superseded pending runs coalesce.
concurrency:
  group: nightly-desktop
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  select:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.select.outputs.build }}
      sha: ${{ steps.select.outputs.sha }}
      version: ${{ steps.select.outputs.version }}
      tag: ${{ steps.select.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - id: select
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_BUILD: ${{ inputs.force || false }}
        run: node packages/desktop/scripts/nightly-release.mjs

  release:
    needs: select
    if: needs.select.outputs.build == 'true'
    uses: ./.github/workflows/desktop-ci.yml
    with:
      source_sha: ${{ needs.select.outputs.sha }}
      release_version: ${{ needs.select.outputs.version }}
      release_tag: ${{ needs.select.outputs.tag }}
    secrets: inherit
