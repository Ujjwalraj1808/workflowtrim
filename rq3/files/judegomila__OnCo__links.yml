name: Weekly citation link check

on:
  schedule:
    - cron: "17 4 * * 3" # Wednesdays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npx tsx scripts/check-links.ts
      # What a reader downloads, against the ceilings in src/data/page-weight.json. This runs here rather than in
      # the suite because the number only exists on a built, served page: every budget inside vitest measures
      # static markup, and the hydration payload is 30 to 81 per cent of the bytes. It fails the job rather than
      # opening a pull request, because a page that grew past its ceiling is a regression to look at, not a
      # snapshot to merge.
      - name: Page weight against the live site
        run: npx tsx scripts/page-weight.ts --check
      # The merge below is unattended, so the tree the pull request carries must pass what a person's branch passes.
      # The gates never fail the job: when one does the pull request is still opened, the merge step is skipped and
      # the next step labels it for review, so a red snapshot waits for a person instead of landing on main.
      - id: gates
        uses: ./.github/actions/gates
      - uses: peter-evans/create-pull-request@v7
        id: cpr
        with:
          branch: bot/check-links
          title: "Weekly link check: broken citations and archive copies"
          commit-message: "chore: weekly citation link check"
          body: |
            Automated weekly run of `scripts/check-links.ts`: every cited URL probed (HEAD, then GET), redirects and domain moves recorded, Wayback Machine snapshots looked up and requested for broken links.
            This covers the urgent-advice sources of `src/data/red-flags.ts` as well as the corpus, and flags a soft 404 (a `.pdf` URL answering 200 with HTML) as gone.
            Review `public/links.json`; the broken-links section of /audit/ renders it. Replace dead URLs with the archive copy or a current source; log factual changes in CORRECTIONS.md.
            A dead red-flag source fails `src/lib/red-flags.test.ts`, so fix those first.
          labels: automated, trust
          delete-branch: true
      - name: Merge it (only when this run's gates passed)
        if: steps.cpr.outputs.pull-request-number != '' && steps.gates.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --squash --delete-branch "${{ steps.cpr.outputs.pull-request-number }}" || echo "merge deferred, the pull request stays open for a human"
      - name: Leave it for review (a gate failed in this run)
        if: steps.cpr.outputs.pull-request-number != '' && steps.gates.outputs.passed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create needs-review --color D93F0B --description "A person must check this before it lands" --force || true
          gh pr edit "${{ steps.cpr.outputs.pull-request-number }}" --add-label needs-review
          gh pr comment "${{ steps.cpr.outputs.pull-request-number }}" --body "Not merged: ${{ steps.gates.outputs.failed }} failed in [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). The snapshot is on this branch for a person to read."
