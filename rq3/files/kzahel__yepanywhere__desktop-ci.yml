name: Desktop CI

on:
  # Shared web/server and lockfile changes are covered by nightly runs.
  push:
    branches: [main]
    tags:
      - 'desktop-v*'
    paths:
      - 'packages/desktop/**'
      - 'packages/server/package.json'
      - 'packages/shared/package.json'
      - 'packages/client/package.json'
      - 'packages/browser-agent/package.json'
      - 'scripts/build-bundle.ts'
      - 'scripts/run-with-safe-home.js'
      - 'scripts/run-with-safe-home.mjs'
      - 'patches/**'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/nightly-desktop.yml'
      - '.github/workflows/desktop-ci.yml'
      - '!packages/desktop/**/*.md'
  pull_request:
    branches: [main]
    paths:
      - 'packages/desktop/**'
      - 'packages/server/package.json'
      - 'packages/shared/package.json'
      - 'packages/client/package.json'
      - 'packages/browser-agent/package.json'
      - 'scripts/build-bundle.ts'
      - 'scripts/run-with-safe-home.js'
      - 'scripts/run-with-safe-home.mjs'
      - 'patches/**'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/nightly-desktop.yml'
      - '.github/workflows/desktop-ci.yml'
      - '!packages/desktop/**/*.md'

  workflow_dispatch:

  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      release_version:
        required: true
        type: string
      release_tag:
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release-input:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.identity.outputs.release_id }}
      publish: ${{ steps.identity.outputs.publish }}
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      sha: ${{ steps.identity.outputs.sha }}
      nightly: ${{ steps.identity.outputs.nightly }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - id: identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ inputs.source_sha || github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name) || '' }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: node packages/desktop/scripts/desktop-release.mjs prepare

  build-tauri:
    needs: release-input
    strategy:
      fail-fast: false
      # tauri-action merges updater metadata in the shared private draft.
      max-parallel: ${{ needs.release-input.outputs.publish == 'true' && 1 || 3 }}
      matrix:
        include:
          # macos-latest is mid-migration to macOS 26 (runner-images#14167, rolling
          # out 2026-06-15 → 2026-07-15). Pin the actual runner to macos-26 so releases
          # are deterministic instead of a coin-flip between the 15 and 26 images.
          # `platform: macos-latest` stays as the discriminator the `if:` steps key on;
          # `runner` controls the image. Bump to macos-27 after a test build when announced.
          - platform: macos-latest
            runner: macos-26
            args: '--target aarch64-apple-darwin'
            rust_target: aarch64-apple-darwin
            target_triple: aarch64-apple-darwin
          - platform: macos-latest
            runner: macos-26
            args: '--target x86_64-apple-darwin'
            rust_target: x86_64-apple-darwin
            target_triple: x86_64-apple-darwin
          - platform: windows-latest
            args: ''
            rust_target: ''
            target_triple: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.runner || matrix.platform }}

    env:
      HAS_MACOS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.MACOS_KEYCHAIN_PASSWORD != '' }}
      HAS_MACOS_NOTARIZATION: ${{ secrets.ASC_API_KEY_P8_BASE64 != '' && secrets.ASC_API_KEY_ID != '' && secrets.ASC_API_ISSUER_ID != '' }}
      HAS_WINDOWS_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.release-input.outputs.sha }}

      - name: Validate tagged release signing requirements
        if: needs.release-input.outputs.publish == 'true'
        shell: bash
        run: |
          if [ "$HAS_UPDATER_KEY" != "true" ]; then
            echo "::error::Tagged desktop releases require TAURI_SIGNING_PRIVATE_KEY."
            exit 1
          fi
          if [ "${{ matrix.platform }}" = "macos-latest" ] && [ "$HAS_MACOS_SIGNING" != "true" ]; then
            echo "::error::Tagged macOS releases require Developer ID signing credentials."
            exit 1
          fi
          if [ "${{ matrix.platform }}" = "macos-latest" ] && [ "$HAS_MACOS_NOTARIZATION" != "true" ]; then
            echo "::error::Tagged macOS releases require notarization credentials."
            exit 1
          fi
          if [ "${{ matrix.platform }}" = "windows-latest" ] && [ "$HAS_WINDOWS_SIGNING" != "true" ]; then
            echo "::error::Tagged Windows releases require complete Azure Trusted Signing credentials."
            exit 1
          fi

      # --- Node.js + pnpm ---
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      # --- Rust ---
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: './packages/desktop/src-tauri -> target'

      # --- macOS code signing ---
      - name: Set up macOS code signing keychain
        if: matrix.platform == 'macos-latest' && env.HAS_MACOS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          echo "Available signing identities:"
          security find-identity -v -p codesigning build.keychain
          rm -f certificate.p12

      - name: Set up macOS notarization credentials
        if: matrix.platform == 'macos-latest' && env.HAS_MACOS_NOTARIZATION == 'true'
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          KEY_PATH="$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # --- Signing env vars ---
      # Inject secrets via this step's `env:` block (GitHub sets the values WITHOUT shell
      # re-parsing) and write them to $GITHUB_ENV with heredocs. Do NOT inline
      # ${{ secrets.* }} into `echo "VAR=..."`: a value containing shell metacharacters
      # (" $ ` \) gets mangled there — an updater password with such a character yields
      # "incorrect updater private key password: Wrong password for that key" at bundle
      # time. Writes stay conditional so empty values don't reach the bundler (an empty
      # APPLE_CERTIFICATE makes Tauri's bundler crash on import).
      - name: Set signing env vars
        shell: bash
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MAC_CERT: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MAC_CERT_PW: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          ASC_KEY: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          emit() { { printf '%s<<__YEPEOF__\n' "$1"; printf '%s\n' "$2"; printf '__YEPEOF__\n'; } >> "$GITHUB_ENV"; }
          if [ -n "$UPDATER_KEY" ]; then
            emit TAURI_SIGNING_PRIVATE_KEY "$UPDATER_KEY"
            emit TAURI_SIGNING_PRIVATE_KEY_PASSWORD "$UPDATER_PW"
          fi
          if [ -n "$MAC_CERT" ] && [ "${{ matrix.platform }}" = "macos-latest" ]; then
            emit APPLE_CERTIFICATE "$MAC_CERT"
            emit APPLE_CERTIFICATE_PASSWORD "$MAC_CERT_PW"
            echo "APPLE_SIGNING_IDENTITY=Developer ID Application: Kyle Graehl (VD7BYQ6ABM)" >> "$GITHUB_ENV"
          fi
          if [ -n "$ASC_KEY" ] && [ "${{ matrix.platform }}" = "macos-latest" ]; then
            emit APPLE_API_KEY "$ASC_KEY"
            emit APPLE_API_ISSUER "$ASC_ISSUER"
          fi

      # --- Windows signing tool ---
      - name: Install trusted-signing-cli
        if: matrix.platform == 'windows-latest' && env.HAS_WINDOWS_SIGNING == 'true'
        run: cargo install trusted-signing-cli

      # --- Install frontend dependencies ---
      # --ignore-scripts avoids building native modules (e.g. better-sqlite3)
      # that belong to other workspace packages and aren't needed for the desktop build
      - name: Install frontend dependencies
        run: pnpm install --ignore-scripts

      - name: Apply nightly package version
        if: needs.release-input.outputs.nightly == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-input.outputs.version }}
        run: node packages/desktop/scripts/nightly-release.mjs apply "$RELEASE_VERSION"

      - name: Prepare packaged desktop runtime
        shell: bash
        env:
          TARGET_TRIPLE: ${{ matrix.target_triple }}
          # Tauri signs external binaries with the release identity while
          # assembling the app bundle. Avoid an earlier ad-hoc replacement
          # after CI has switched macOS to its isolated signing keychain.
          YEP_DESKTOP_SKIP_ADHOC_SIGN: ${{ matrix.platform == 'macos-latest' && '1' || '' }}
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/desktop-runtime-prepare.log"
          if pnpm --dir packages/desktop prepare-runtime 2>&1 | tee "$log"; then
            exit 0
          fi
          detail=$(tail -n 30 "$log")
          detail="${detail//'%'/'%25'}"
          detail="${detail//$'\r'/'%0D'}"
          detail="${detail//$'\n'/'%0A'}"
          echo "::error title=Desktop runtime preparation failed::$detail"
          exit 1

      - name: Verify desktop source
        shell: bash
        run: |
          pnpm --dir packages/desktop prepare-sidecar
          pnpm --dir packages/desktop test
          pnpm --dir packages/desktop build
          cargo fmt --manifest-path packages/desktop/src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path packages/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path packages/desktop/src-tauri/Cargo.toml

      - name: Smoke packaged Windows runtime
        if: matrix.platform == 'windows-latest'
        run: pnpm --dir packages/desktop smoke-runtime

      - name: Sign bundled macOS native modules
        if: matrix.platform == 'macos-latest' && env.HAS_MACOS_SIGNING == 'true'
        shell: bash
        run: |
          signed=0
          while IFS= read -r -d '' binary; do
            if file "$binary" | grep -q 'Mach-O'; then
              codesign --force --timestamp --options runtime \
                --keychain build.keychain \
                --sign "$APPLE_SIGNING_IDENTITY" \
                "$binary"
              codesign --verify --strict --verbose=2 "$binary"
              signed=$((signed + 1))
            fi
          done < <(find packages/desktop/src-tauri/resources/server -type f -name '*.node' -print0)
          echo "Signed and verified $signed bundled Mach-O native module(s)."

      # --- Build Tauri app ---
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TRIPLE: ${{ matrix.target_triple }}
          # Windows signing
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          projectPath: packages/desktop
          tauriScript: ${{ matrix.platform == 'macos-latest' && 'pnpm tauri-ci' || 'pnpm tauri' }}
          releaseId: ${{ needs.release-input.outputs.release_id }}
          releaseCommitish: ${{ needs.release-input.outputs.sha }}
          tagName: ${{ needs.release-input.outputs.tag }}
          releaseName: 'Yep Anywhere Desktop v__VERSION__'
          releaseBody: 'Signed desktop build; publication pending complete platform validation.'
          releaseDraft: true
          prerelease: ${{ needs.release-input.outputs.nightly == 'true' }}
          retryAttempts: ${{ matrix.platform == 'macos-latest' && '1' || '0' }}
          includeUpdaterJson: ${{ needs.release-input.outputs.publish == 'true' }}
          updaterJsonKeepUniversal: true
          args: >-
            ${{ matrix.args }}
            --config src-tauri/tauri.ci.conf.json
            ${{ matrix.platform == 'macos-latest' && env.HAS_MACOS_SIGNING != 'true' && '--no-sign' || '' }}
            ${{ env.HAS_UPDATER_KEY == 'true' && '--config ''{"bundle":{"createUpdaterArtifacts":true}}''' || '' }}
            ${{ matrix.platform == 'windows-latest' && secrets.AZURE_CLIENT_SECRET != '' && '--config ''{"bundle":{"windows":{"signCommand":"trusted-signing-cli -e https://eus.codesigning.azure.net -a kylegraehl -c jstorrent-profile %1"}}}''' || '' }}

      # --- Diagnose macOS build failure ---
      # Only blame the flaky hdiutil DMG issue when the build actually got past codesign
      # (a signed .app exists) but produced no .dmg. Otherwise point at the real failure,
      # so we don't chase a phantom DMG flake (config error, updater key/pubkey, etc.).
      - name: Diagnose macOS build failure
        if: failure() && matrix.platform == 'macos-latest'
        shell: bash
        run: |
          log="$RUNNER_TEMP/yep-tauri-build.log"
          if [ -f "$log" ]; then
            detail=$(tail -n 40 "$log")
            detail="${detail//'%'/'%25'}"
            detail="${detail//$'\r'/'%0D'}"
            detail="${detail//$'\n'/'%0A'}"
            echo "::error title=macOS Tauri build tail::$detail"
          fi
          app=$(find packages/desktop/src-tauri/target -type d -path '*/release/bundle/macos/*.app' 2>/dev/null | head -1)
          dmg=$(find packages/desktop/src-tauri/target -type f -path '*/release/bundle/dmg/*.dmg' 2>/dev/null | head -1)
          if [ -n "$app" ] && [ -z "$dmg" ]; then
            echo "::error::macOS .app assembly completed but no .dmg was produced after the bounded Tauri action retry. Read the captured Tauri tail for nested signing, notarization, or DMG details."
          elif [ -z "$app" ]; then
            echo "::error::macOS pipeline failed before the app bundle was produced. Read the first failed step (runtime preparation / compile / config / codesign); this is a real error, NOT a DMG flake."
          else
            echo "::error::macOS .app and .dmg both built; failure was a later step (updater signing / latest.json). Read the 'Build Tauri app' step log — NOT a DMG flake."
          fi

      # --- Cleanup ---
      - name: Clean up macOS keychain
        if: matrix.platform == 'macos-latest' && always()
        run: |
          security delete-keychain build.keychain 2>/dev/null || true
          rm -rf ~/private_keys 2>/dev/null || true

  finalize-release:
    if: needs.release-input.outputs.publish == 'true'
    needs: [release-input, build-tauri]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release-input.outputs.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Install signature verifier
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Validate complete draft and publish immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.release-input.outputs.sha }}
          RELEASE_TAG: ${{ needs.release-input.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release-input.outputs.version }}
        run: node packages/desktop/scripts/desktop-release.mjs publish
